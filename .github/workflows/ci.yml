name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (all runs everything)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - test
          - lint
          - fuzz
          - fuzz-long
          - benchmark
          - parity
          - parity-explore

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }} / ${{ matrix.os }})
    # Run this job when:
    # - event is not a manual dispatch (push/pr) OR
    # - event is manual dispatch and input.job is "all" or "test"
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJson('["all","test"]'), github.event.inputs.job) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26', '1.27']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build -v ./...

      - name: Run tests
        shell: bash
        run: go test -v -coverprofile=coverage.out ./...

      - name: Run tests with race detector
        shell: bash
        run: go test -race -v ./...

      - name: Upload coverage (ubuntu + latest Go only)
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJson('["all","lint"]'), github.event.inputs.job) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  fuzz:
    name: Fuzz Tests
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJson('["all","fuzz"]'), github.event.inputs.job) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run fuzz tests
        run: make fuzz

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failing-inputs
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  parity:
    name: Git Parity
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJson('["all","parity"]'), github.event.inputs.job) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Show git version
        run: git --version

      - name: Run parity harness
        env:
          GOIGNORE_PARITY: "1"
        shell: bash
        run: |
          go test -run '^TestParity$' -count=1 -v . | tee parity.out
          grep -q '^--- PASS: TestParity ' parity.out

  # Report-only exploration on a fresh seed; never compared with the baseline.
  parity-explore:
    name: Git Parity (explore)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'parity-explore' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Show git version
        run: git --version

      - name: Explore a new seed
        env:
          GOIGNORE_PARITY: "1"
          GOIGNORE_PARITY_SEEDS: ${{ github.run_id }}
        run: go test -run '^TestParity$' -count=1 -v .

  # Long-form fuzz: 30 minutes per fuzzer. Runs only when
  # explicitly dispatched (never on push/PR) — burns hours of CI compute and
  # is intended for pre-release verification of stable tags.
  fuzz-long:
    name: Fuzz Tests (long)
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJson('["fuzz-long"]'), github.event.inputs.job) }}
    runs-on: ubuntu-latest
    # 30m per fuzzer plus build time; raise it when adding fuzzers.
    timeout-minutes: 330
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run long-form fuzz tests
        run: make fuzz-long

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-long-failing-inputs
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  benchmark:
    name: Benchmarks
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJson('["all","benchmark"]'), github.event.inputs.job) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./... | tee benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark.txt
