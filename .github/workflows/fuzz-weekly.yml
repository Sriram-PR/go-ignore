name: Fuzz (weekly)

on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-weekly:
    name: Fuzz Tests (weekly)
    runs-on: ubuntu-latest
    # 10m per fuzzer plus build time; raise it when adding fuzzers.
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run fuzz tests
        run: make fuzz FUZZTIME=10m

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-weekly-failing-inputs
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
